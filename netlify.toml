[build]
  publish = "."

[[redirects]]
  from = "/favicon.ico"
  to = "/assets/favicon.svg"
  status = 200

[[redirects]]
  from = "/about"
  to = "/HTML/about.html"
  status = 200

[[redirects]]
  from = "/game"
  to = "/HTML/game.html"
  status = 200

[[redirects]]
  from = "/person"
  to = "/HTML/person.html"
  status = 200

# CHANGED: Replaced the 200 rewrite with a standard 404 redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404